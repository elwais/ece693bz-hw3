[project]
name = "code"
version = "0.1.0"
description = "ECE 693B homework 3 code: shared MCMC utilities and Problem 1/2 drivers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
]

[project.scripts]
p1 = "p1.run:main"
p2 = "p2.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["mcmc_core.py", "mcmc_diagnostics.py", "p1", "p2"]
